# Publie le site vitrine sur GitHub Pages à chaque envoi sur la branche main.
# Adresse : https://amancedric.github.io/vitrine_wassia/
#
# Version de démonstration statique : les pages pré-rendues sont servies telles quelles,
# sans le serveur Express (le formulaire de contact affiche donc un message à la place de l'envoi).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Build pour GitHub Pages
        run: npm run build:pages

      - name: Page 404 et désactivation de Jekyll
        run: |
          cp dist/wassia-vitrine/browser/index.csr.html dist/wassia-vitrine/browser/404.html
          touch dist/wassia-vitrine/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wassia-vitrine/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
